# One run publishes THREE releases on this public repo:
#   plugin-v<X.Y.Z>   — mirror of the private plugin release (zip + sha1)
#   bundle-v<A.B.C>   — mirror of the private platform release (bundle + CLI)
#   v<X.Y.Z>          — the compatibility suite: both sides on one page,
#                       marked Latest (the update banner and the CLI's
#                       latest/download default both read this one)
#
# Inputs left empty resolve to each source repo's LATEST release, so the
# common case ("publish what both repos just released") is a bare Run.
# A mirror whose tag already exists is skipped (re-pairing an old side with
# a new one re-uses the existing mirror).
#
# Required repo secret:
#   SOURCE_REPOS_TOKEN — fine-grained PAT with contents:read on
#     antreklabs/iyzitrace and antreklabs/iyzitrace-observability-platform.
name: Publish suite

on:
  workflow_dispatch:
    inputs:
      plugin_tag:
        description: 'Plugin release tag on antreklabs/iyzitrace (e.g. v1.0.15; empty = latest release)'
        required: false
        default: ''
      bundle_tag:
        description: 'Bundle release tag on antreklabs/iyzitrace-observability-platform (e.g. bundle-v0.0.5; empty = latest release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source tags (empty input = latest release)
        id: tags
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          plugin="${{ inputs.plugin_tag }}"
          if [ -z "$plugin" ]; then
            plugin=$(gh api repos/antreklabs/iyzitrace/releases/latest --jq .tag_name)
          fi
          bundle="${{ inputs.bundle_tag }}"
          if [ -z "$bundle" ]; then
            bundle=$(gh api repos/antreklabs/iyzitrace-observability-platform/releases/latest --jq .tag_name)
          fi
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "Publishing: plugin $plugin + platform $bundle"

      - name: Download plugin release assets
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: |
          mkdir -p plugin
          gh release download "${{ steps.tags.outputs.plugin }}" \
            --repo antreklabs/iyzitrace --dir plugin

      - name: Download platform bundle + CLI assets
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPOS_TOKEN }}
        run: |
          mkdir -p platform
          gh release download "${{ steps.tags.outputs.bundle }}" \
            --repo antreklabs/iyzitrace-observability-platform --dir platform

      - name: Publish the plugin mirror release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pv="${{ steps.tags.outputs.plugin }}"; pv="${pv#v}"
          tag="plugin-v${pv}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "$tag already published, skipping mirror."
            exit 0
          fi
          gh release create "$tag" plugin/* \
            --repo "${{ github.repository }}" \
            --title "plugin v${pv}" \
            --notes "Grafana plugin **antreklabs-iyzitrace-app v${pv}**, standalone. Pairs with the platform version named in suite release v${pv}. Prefer installing both sides from a suite (v*) release page." \
            --latest=false

      - name: Publish the platform mirror release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bv="${{ steps.tags.outputs.bundle }}"; bv="${bv#bundle-v}"
          tag="bundle-v${bv}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "$tag already published, skipping mirror."
            exit 0
          fi
          gh release create "$tag" platform/* \
            --repo "${{ github.repository }}" \
            --title "platform bundle v${bv}" \
            --notes "IyziTrace platform **bundle v${bv}** with CLI binaries, standalone. Prefer installing both sides from a suite (v*) release page." \
            --latest=false

      - name: Add the versionless bundle alias the CLI defaults to
        # `iyzitrace init` fetches releases/latest/download/iyzitrace-bundle.tar.gz,
        # so every suite must carry the bundle under that fixed name too. The
        # .sha256 sibling is re-stated for the alias so --require-checksum works.
        run: |
          set -euo pipefail
          mkdir -p suite
          cp plugin/* platform/* suite/
          cd suite
          tarball=$(ls iyzitrace-bundle-*.tar.gz)
          cp "$tarball" iyzitrace-bundle.tar.gz
          sha=$(sha256sum iyzitrace-bundle.tar.gz | cut -d' ' -f1)
          printf '%s  iyzitrace-bundle.tar.gz\n' "$sha" > iyzitrace-bundle.tar.gz.sha256

      - name: Publish the suite release (Latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle_version="${{ steps.tags.outputs.bundle }}"
          bundle_version="${bundle_version#bundle-v}"
          plugin_version="${{ steps.tags.outputs.plugin }}"
          plugin_version="${plugin_version#v}"
          {
            echo "Compatible release suite — install both sides from this page."
            echo
            echo "| Component | Version | Standalone mirror |"
            echo "|---|---|---|"
            echo "| Plugin (antreklabs-iyzitrace-app) | ${plugin_version} | [plugin-v${plugin_version}](https://github.com/${{ github.repository }}/releases/tag/plugin-v${plugin_version}) |"
            echo "| Platform bundle | ${bundle_version} | [bundle-v${bundle_version}](https://github.com/${{ github.repository }}/releases/tag/bundle-v${bundle_version}) |"
            echo
            echo "See the README for installation steps."
          } > notes.md
          gh release create "${{ steps.tags.outputs.plugin }}" suite/* \
            --repo "${{ github.repository }}" \
            --title "iyzitrace ${{ steps.tags.outputs.plugin }}" \
            --notes-file notes.md \
            --latest
